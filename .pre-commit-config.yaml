repos:
- repo: https://github.com/fastai/nbdev
  rev: 3.3.15
  hooks:
  - id: nbdev_clean
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.6
  hooks:
  - id: ruff
    types_or: [ python, pyi, jupyter ]
  - id: ruff-format
    types_or: [ python, pyi, jupyter ]
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.3.1
  hooks:
  - id: mypy
