# Example configuration for TinyVit training

data:
  dataset_name: "cifar10"
  batch_size: 32
  num_workers: 4

model:
  model_name: "tiny_vit"
  pretrained: false
  num_classes: 10

training:
  epochs: 10
  learning_rate: 0.001
  optimizer: "adam"
  device: "cuda"

