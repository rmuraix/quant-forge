[project]
name = "quantforge"
version = "0.1.0"
description = "QuantForge: fine-tune and quantize image classification models"
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "timm>=1.0.0",
    "datasets>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "torch>=2.12.0",
    "torchvision>=0.15.0",
    "typer>=0.9.0",
    "wandb>=0.15.0",
    "rich>=13.0.0",
    "pillow>=9.0.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
quantize = [
    "torchao>=0.1.0",
]

[project.scripts]
quantforge = "quantforge.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "mypy==1.20.2",
    "nbdev==3.0.17",
    "pre-commit>=4.1.0",
    "pytest>=7.0.0",
    "ruff==0.15.12",
]
