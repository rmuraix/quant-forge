[project]
name = "quantforge"
version = "0.1.0"
description = "QuantForge: fine-tune and quantize image classification models"
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "timm>=1.0.29",
    "datasets>=5.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "typer>=0.27.2",
    "wandb>=0.29.0",
    "rich>=15.0.0",
    "pillow>=12.3.0",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
quantize = [
    "torchao>=0.18.0",
]

[project.scripts]
quantforge = "quantforge.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "mypy==2.3.1",
    "nbdev==3.3.15",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff==0.16.6",
]

[tool.ruff.lint]
# Ruff 0.16 widened its built-in default rule set. This repo had no explicit
# selection, so pin the set it was already linting against (Ruff's pre-0.16
# defaults) to keep the dependency bump behaviour-neutral.
select = ["E4", "E7", "E9", "F"]
