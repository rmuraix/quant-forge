data:
  dataset_name: "food101"
  batch_size: 64
  num_workers: 4

model:
  model_name: "vit_base_patch16_224"
  pretrained: true
  num_classes: 101
  drop_rate: 0.1
  drop_path_rate: 0.1
  freeze_backbone: false

training:
  epochs: 25
  learning_rate: 0.0002
  optimizer: "adamw"
  device: "cuda"

eval:
  checkpoint_path: "./checkpoints/vit_food101.pt"
  batch_size: 64
  device: "cuda"

predict:
  checkpoint_path: "./checkpoints/vit_food101.pt"
  input_path: "./data/food101/sample_images"
  output_path: "./predictions/food101.json"
  device: "cuda"
